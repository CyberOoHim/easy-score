<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="favEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- High-contrast rounded background -->
  <rect width="64" height="64" rx="15" fill="url(#favBg)" />
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none" stroke="url(#favGold)" stroke-width="2" stroke-opacity="0.6" />

  <!-- Piano Keyboard base at bottom -->
  <rect x="8" y="38" width="48" height="18" rx="4" fill="#27272a" />
  <!-- Piano Keys -->
  <rect x="11" y="40" width="6" height="14" rx="1.5" fill="#f4f4f5" />
  <rect x="18" y="40" width="6" height="14" rx="1.5" fill="#f4f4f5" />
  <rect x="25" y="40" width="6" height="14" rx="1.5" fill="#f4f4f5" />
  <rect x="32" y="40" width="6" height="14" rx="1.5" fill="#fef08a" />
  <rect x="39" y="40" width="6" height="14" rx="1.5" fill="url(#favGold)" />
  <rect x="46" y="40" width="7" height="14" rx="1.5" fill="#f4f4f5" />
  <!-- Black Key Accents -->
  <rect x="15" y="40" width="4" height="8" rx="1" fill="#09090b" />
  <rect x="29" y="40" width="4" height="8" rx="1" fill="#09090b" />
  <rect x="43" y="40" width="4" height="8" rx="1" fill="#09090b" />

  <!-- Numbered Note "5" in center with high tone dot and "1" beside it -->
  <!-- Note 1 -->
  <text x="18" y="27" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="url(#favEmerald)" text-anchor="middle">1</text>
  <rect x="13" y="30" width="10" height="2" rx="1" fill="#10b981" />

  <!-- High Tone Dot -->
  <circle cx="34" cy="11" r="2.5" fill="#fbbf24" />
  <circle cx="34" cy="11" r="1.5" fill="#ffffff" />
  
  <!-- Note 5 (Hero) -->
  <text x="34" y="28" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle">5</text>
  <rect x="27" y="31" width="14" height="2.5" rx="1.2" fill="url(#favGold)" />

  <!-- Note 6 -->
  <text x="49" y="27" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="url(#favGold)" text-anchor="middle">6</text>
  <circle cx="49" cy="31" r="1.5" fill="#fbbf24" />
</svg>
