<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Full Bleed) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#121215" />
    </linearGradient>

    <!-- Amber Gold Gradient -->
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Emerald Teal Gradient for Audio/Pitch -->
    <linearGradient id="emeraldTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="ambientLight" cx="50%" cy="45%" r="48%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22" />
      <stop offset="70%" stop-color="#10b981" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Full Bleed Background (Required for Maskable icons) -->
  <rect width="512" height="512" fill="url(#bgGrad)" />
  <rect width="512" height="512" fill="url(#ambientLight)" />

  <!-- Background Staff Lines within safe zone -->
  <g opacity="0.2">
    <path d="M 80 180 C 160 150, 220 200, 320 170 C 370 150, 400 170, 432 160" fill="none" stroke="url(#emeraldTeal)" stroke-width="3" stroke-dasharray="6 6" />
    <path d="M 80 340 C 160 370, 220 320, 320 350 C 370 370, 400 350, 432 360" fill="none" stroke="url(#amberGold)" stroke-width="3" stroke-dasharray="4 6" />
  </g>

  <!-- Safe Zone Group: All elements safely contained within 80-432 px box / 180px radius -->
  <g id="safe-zone-content">
    <!-- Stylized Piano Keyboard Base -->
    <g transform="translate(100, 245)">
      <rect x="0" y="0" width="312" height="105" rx="16" fill="#18181b" stroke="#3f3f46" stroke-width="2" />
      <rect x="3" y="3" width="306" height="99" rx="13" fill="#121215" />

      <!-- White Keys -->
      <rect x="10" y="8" width="38" height="88" rx="6" fill="#f4f4f5" />
      <rect x="52" y="8" width="38" height="88" rx="6" fill="#f4f4f5" />
      <rect x="94" y="8" width="38" height="88" rx="6" fill="#f4f4f5" />
      <rect x="136" y="8" width="38" height="88" rx="6" fill="#f4f4f5" />
      <rect x="178" y="8" width="38" height="88" rx="6" fill="#fef08a" />
      <rect x="220" y="8" width="38" height="88" rx="6" fill="url(#amberGold)" filter="url(#softGlow)" />
      <rect x="262" y="8" width="38" height="88" rx="6" fill="#f4f4f5" />

      <!-- Black Keys -->
      <rect x="36" y="8" width="22" height="54" rx="4" fill="#27272a" stroke="#09090b" stroke-width="1.5" />
      <rect x="78" y="8" width="22" height="54" rx="4" fill="#27272a" stroke="#09090b" stroke-width="1.5" />
      <rect x="162" y="8" width="22" height="54" rx="4" fill="#27272a" stroke="#09090b" stroke-width="1.5" />
      <rect x="204" y="8" width="22" height="54" rx="4" fill="#18181b" stroke="#f59e0b" stroke-width="1.5" />
      <rect x="246" y="8" width="22" height="54" rx="4" fill="#27272a" stroke="#09090b" stroke-width="1.5" />
    </g>

    <!-- Numbered Notation (簡譜) -->
    <g id="numbered-notes-maskable" filter="url(#softGlow)">
      <!-- Note 1 (Left) -->
      <g transform="translate(150, 190)">
        <circle cx="0" cy="-36" r="4.5" fill="#34d399" />
        <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="#34d399" text-anchor="middle">1</text>
        <rect x="-14" y="10" width="28" height="4" rx="2" fill="#10b981" />
      </g>

      <!-- Note 3 (Middle-Left) -->
      <g transform="translate(218, 175)">
        <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="62" fill="#fbbf24" text-anchor="middle">3</text>
        <rect x="-18" y="11" width="36" height="5" rx="2.5" fill="#f59e0b" />
        <rect x="-18" y="19" width="36" height="4" rx="2" fill="#d97706" />
      </g>

      <!-- Note 5 (Hero Center Note) -->
      <g transform="translate(294, 160)">
        <!-- High octave dot -->
        <circle cx="0" cy="-46" r="6" fill="#fbbf24" filter="url(#softGlow)" />
        <circle cx="0" cy="-46" r="3.5" fill="#ffffff" />
        <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="76" fill="#ffffff" text-anchor="middle">5</text>
        <rect x="-24" y="13" width="48" height="6" rx="3" fill="url(#amberGold)" />
      </g>

      <!-- Note 6 (Right) -->
      <g transform="translate(362, 185)">
        <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="56" fill="#fbbf24" text-anchor="middle">6</text>
        <!-- Low octave dot -->
        <circle cx="0" cy="16" r="4.5" fill="#f59e0b" />
      </g>
    </g>

    <!-- Vocal Hum / Mic Badge (Top Left inside safe zone) -->
    <g transform="translate(112, 115)" filter="url(#softGlow)">
      <circle cx="22" cy="22" r="22" fill="#09090b" stroke="url(#emeraldTeal)" stroke-width="2.5" />
      <rect x="17" y="12" width="10" height="15" rx="5" fill="url(#emeraldTeal)" />
      <path d="M 12 20 C 12 25.5 16.5 29 22 29 C 27.5 29 32 25.5 32 20" fill="none" stroke="url(#emeraldTeal)" stroke-width="2.5" stroke-linecap="round" />
      <line x1="22" y1="29" x2="22" y2="34" stroke="url(#emeraldTeal)" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Bottom Brand Text Label within Safe Area -->
    <g transform="translate(256, 400)">
      <text x="0" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#f4f4f5" text-anchor="middle" letter-spacing="3">SCORE TRANSCRIBER</text>
      <text x="0" y="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="12" fill="url(#amberGold)" text-anchor="middle" letter-spacing="3">HUM &amp; KEYBOARD STUDIO</text>
    </g>
  </g>
</svg>
