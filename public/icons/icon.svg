<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#121215" />
    </linearGradient>

    <!-- Amber Gold Gradient -->
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Emerald Teal Gradient for Audio/Pitch -->
    <linearGradient id="emeraldTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Vibrant Multi-Tone Chord Gradient -->
    <linearGradient id="chordGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="45%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="heavyGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="ambientLight" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18" />
      <stop offset="70%" stop-color="#10b981" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="112" fill="url(#ambientLight)" />
  <rect x="3" y="3" width="506" height="506" rx="109" fill="none" stroke="url(#amberGold)" stroke-width="5" stroke-opacity="0.35" />

  <!-- Background Staff / Dynamic Audio Waves -->
  <g opacity="0.25">
    <path d="M 48 160 C 140 130, 200 190, 320 150 C 380 130, 420 150, 464 140" fill="none" stroke="url(#emeraldTeal)" stroke-width="3" stroke-dasharray="6 6" />
    <path d="M 48 185 C 140 155, 200 215, 320 175 C 380 155, 420 175, 464 165" fill="none" stroke="#71717a" stroke-width="2" />
    <path d="M 48 350 C 140 380, 220 320, 340 360 C 400 380, 430 360, 464 370" fill="none" stroke="url(#amberGold)" stroke-width="3" stroke-dasharray="4 6" />
  </g>

  <!-- Central Musical Core Structure -->
  <!-- Stylized Piano Keyboard Base -->
  <g transform="translate(68, 230)">
    <!-- Keyboard Backplate -->
    <rect x="0" y="0" width="376" height="130" rx="20" fill="#18181b" stroke="#3f3f46" stroke-width="2" />
    <rect x="4" y="4" width="368" height="122" rx="16" fill="#121215" />

    <!-- White Keys -->
    <!-- Key 1 -->
    <rect x="12" y="10" width="46" height="110" rx="8" fill="#f4f4f5" />
    <!-- Key 2 -->
    <rect x="64" y="10" width="46" height="110" rx="8" fill="#f4f4f5" />
    <!-- Key 3 -->
    <rect x="116" y="10" width="46" height="110" rx="8" fill="#f4f4f5" />
    <!-- Key 4 -->
    <rect x="168" y="10" width="46" height="110" rx="8" fill="#f4f4f5" />
    <!-- Key 5 -->
    <rect x="220" y="10" width="46" height="110" rx="8" fill="#fef08a" />
    <!-- Key 6 (Active / Highlighted) -->
    <rect x="272" y="10" width="46" height="110" rx="8" fill="url(#amberGold)" filter="url(#softGlow)" />
    <!-- Key 7 -->
    <rect x="324" y="10" width="40" height="110" rx="8" fill="#f4f4f5" />

    <!-- Black Keys -->
    <rect x="44" y="10" width="28" height="68" rx="5" fill="#27272a" stroke="#09090b" stroke-width="2" />
    <rect x="96" y="10" width="28" height="68" rx="5" fill="#27272a" stroke="#09090b" stroke-width="2" />
    <rect x="200" y="10" width="28" height="68" rx="5" fill="#27272a" stroke="#09090b" stroke-width="2" />
    <rect x="252" y="10" width="28" height="68" rx="5" fill="#18181b" stroke="#f59e0b" stroke-width="2" />
    <rect x="304" y="10" width="28" height="68" rx="5" fill="#27272a" stroke="#09090b" stroke-width="2" />
  </g>

  <!-- Numbered Notation (簡譜) Floating Over Piano -->
  <g id="numbered-notes" filter="url(#softGlow)">
    <!-- Note 1 (Left) -->
    <g transform="translate(130, 160)">
      <circle cx="0" cy="-44" r="5" fill="#34d399" />
      <text x="0" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" fill="#34d399" text-anchor="middle">1</text>
      <rect x="-18" y="12" width="36" height="5" rx="2.5" fill="#10b981" />
    </g>

    <!-- Note 3 (Middle-Left) -->
    <g transform="translate(215, 140)">
      <text x="0" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="76" fill="#fbbf24" text-anchor="middle">3</text>
      <rect x="-22" y="14" width="44" height="6" rx="3" fill="#f59e0b" />
      <rect x="-22" y="24" width="44" height="5" rx="2.5" fill="#d97706" />
    </g>

    <!-- Note 5 (Hero Center Note) -->
    <g transform="translate(305, 125)">
      <!-- High octave dot -->
      <circle cx="0" cy="-56" r="7" fill="#fbbf24" filter="url(#softGlow)" />
      <circle cx="0" cy="-56" r="4" fill="#ffffff" />
      <text x="0" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="94" fill="#ffffff" text-anchor="middle">5</text>
      <rect x="-28" y="16" width="56" height="7" rx="3.5" fill="url(#amberGold)" />
    </g>

    <!-- Note 6 (Right) -->
    <g transform="translate(390, 155)">
      <text x="0" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="68" fill="#fbbf24" text-anchor="middle">6</text>
      <!-- Low octave dot -->
      <circle cx="0" cy="20" r="5" fill="#f59e0b" />
    </g>
  </g>

  <!-- Vocal Hum / Microphone Badge (Top Left) -->
  <g transform="translate(85, 80)" filter="url(#softGlow)">
    <circle cx="26" cy="26" r="28" fill="#09090b" stroke="url(#emeraldTeal)" stroke-width="3" />
    <!-- Microphone Silhouette -->
    <rect x="20" y="14" width="12" height="18" rx="6" fill="url(#emeraldTeal)" />
    <path d="M 14 23 C 14 29.6 19.4 34 26 34 C 32.6 34 38 29.6 38 23" fill="none" stroke="url(#emeraldTeal)" stroke-width="3" stroke-linecap="round" />
    <line x1="26" y1="34" x2="26" y2="40" stroke="url(#emeraldTeal)" stroke-width="3" stroke-linecap="round" />
    
    <!-- Sound Waves Emanating from Mic -->
    <path d="M 44 17 C 48 20 48 32 44 35" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 50 12 C 57 17 57 37 50 42" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- Bottom Brand Text Label -->
  <g transform="translate(256, 428)">
    <text x="0" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="32" fill="#f4f4f5" text-anchor="middle" letter-spacing="4">SCORE TRANSCRIBER</text>
    <text x="0" y="26" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="14" fill="url(#amberGold)" text-anchor="middle" letter-spacing="4">HUM &amp; KEYBOARD STUDIO</text>
  </g>
</svg>
